<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeroQuest</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    body {
      display: flex;
    }

    canvas {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-width: 0;
      cursor: pointer;
    }

    .panel-toggle {
      position: absolute;
      z-index: 3;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      border: 1px solid #8c7342;
      border-radius: 6px;
      background: #1c1a17;
      color: #f3ead7;
      font: 600 14px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    body.panel-open .panel-toggle {
      right: calc(280px + 16px);
    }

    .quest-panel {
      display: none;
      box-sizing: border-box;
      flex: 0 0 280px;
      width: 280px;
      height: 100%;
      padding: 20px 18px;
      overflow: auto;
      background: #1c1a17;
      color: #f3ead7;
      border-left: 1px solid #3d362c;
      font: 14px/1.4 system-ui, sans-serif;
    }

    body.panel-open .quest-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .quest-panel h2 {
      margin: 28px 0 0;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .quest-panel fieldset {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .quest-panel legend {
      margin-bottom: 8px;
      color: #c7b48a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .quest-panel fieldset label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
      cursor: pointer;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #c7b48a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .quest-panel select {
      padding: 8px;
      border: 1px solid #5c5348;
      border-radius: 6px;
      background: #111;
      color: #f3ead7;
      font: 14px/1.3 system-ui, sans-serif;
      text-transform: none;
      letter-spacing: 0;
    }

    #generate-quest {
      padding: 10px 12px;
      border: 0;
      border-radius: 6px;
      background: #e2c27a;
      color: #1c1a17;
      font: 700 14px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    #generate-quest:hover {
      background: #efd7a0;
    }

    .reveal {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="false" aria-controls="quest-panel">Quest</button>
  <aside id="quest-panel" class="quest-panel" aria-hidden="true">
    <h2>Quest</h2>
    <fieldset>
      <legend>Difficulty</legend>
      <label><input type="radio" name="difficulty" value="easy"> Easy</label>
      <label><input type="radio" name="difficulty" value="normal" checked> Normal</label>
      <label><input type="radio" name="difficulty" value="hard"> Hard</label>
    </fieldset>
    <label class="field" for="objective-room">
      Objective room
      <select id="objective-room">
        <option value="">None</option>
      </select>
    </label>
    <button id="generate-quest" type="button">Generate New Quest</button>
    <label class="reveal">
      <input id="reveal-all" type="checkbox">
      Reveal All
    </label>
  </aside>
  <script>
    const COLS = 26;
    const ROWS = 19;
    // Playable squares in board.jpeg pixels: columns A–Z, rows 1–19 from the top.
    const GRID = { x: 5.82, y: 3.73, width: 604.69, height: 443.57 };

    // Classic European board, transcribed from HeroScribe's Board_EU room strokes.
    // Each rectangle is [x, y, width, height] in squares. HeroScribe's origin is the
    // bottom-left, beside the logo (column A, rank 1). This file numbers row 1 from
    // the top of the picture, so createBoard() flips y when it builds the cells.
    // A stroke is the wall around those squares. Overlapping rectangles are the
    // internal walls that divide a block into separate rooms.
    const CLASSIC_ROOM_RECTS = [
      [10, 7, 6, 5],   // central chamber
      [1, 1, 8, 8],    // lower-left block
      [9, 1, 3, 5],
      [5, 1, 4, 5],
      [1, 5, 4, 4],
      [5, 6, 2, 3],
      [1, 10, 8, 8],   // upper-left block
      [1, 10, 4, 8],
      [1, 15, 8, 3],
      [9, 13, 3, 5],
      [14, 1, 4, 5],   // lower-right block
      [18, 1, 7, 4],
      [21, 1, 4, 8],
      [14, 13, 3, 5],  // upper-right block
      [17, 10, 8, 8],
      [17, 14, 8, 4],
      [17, 10, 4, 8],
    ];

    // Two walls in the lower-right that are single lines rather than rectangles.
    // Vertical: east side of column 16, HeroScribe rows 6–8.
    // Horizontal: north side of HeroScribe row 8, columns 17–20.
    const CLASSIC_EXTRA_WALLS = [
      { dir: "v", col: 16, row: 6, length: 3 },
      { dir: "h", col: 17, row: 8, length: 4 },
    ];

    const SIDES = ["north", "east", "south", "west"];
    const STEP = {
      north: { dc: 0, dr: -1 },
      south: { dc: 0, dr: 1 },
      east: { dc: 1, dr: 0 },
      west: { dc: -1, dr: 0 },
    };
    const OPPOSITE = { north: "south", south: "north", east: "west", west: "east" };

    function emptyWalls() {
      return { north: false, east: false, south: false, west: false };
    }

    // HeroScribe rank (0 at the logo) to this file's row (0 at the top of the image).
    function imageRowFromClassic(classicRow) {
      return ROWS - 1 - classicRow;
    }

    function createBoard() {
      const cells = Array.from({ length: ROWS }, (_, row) => (
        Array.from({ length: COLS }, (_, col) => ({
          col,
          row,
          isRoom: false,
          roomId: null,
          walls: emptyWalls(),
        }))
      ));

      for (const [x, classicY, width, height] of CLASSIC_ROOM_RECTS) {
        const row = imageRowFromClassic(classicY + height - 1);
        for (let dr = 0; dr < height; dr++) {
          for (let col = x; col < x + width; col++) {
            cells[row + dr][col].isRoom = true;
          }
        }
      }

      function addWall(col, row, side) {
        if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return;
        cells[row][col].walls[side] = true;
        const { dc, dr } = STEP[side];
        const neighbor = cells[row + dr] && cells[row + dr][col + dc];
        if (neighbor) neighbor.walls[OPPOSITE[side]] = true;
      }

      for (let col = 0; col < COLS; col++) {
        addWall(col, 0, "north");
        addWall(col, ROWS - 1, "south");
      }
      for (let row = 0; row < ROWS; row++) {
        addWall(0, row, "west");
        addWall(COLS - 1, row, "east");
      }

      for (const [x, classicY, width, height] of CLASSIC_ROOM_RECTS) {
        const north = imageRowFromClassic(classicY + height - 1);
        const south = imageRowFromClassic(classicY);
        for (let col = x; col < x + width; col++) {
          addWall(col, north, "north");
          addWall(col, south, "south");
        }
        for (let row = north; row <= south; row++) {
          addWall(x, row, "west");
          addWall(x + width - 1, row, "east");
        }
      }

      for (const wall of CLASSIC_EXTRA_WALLS) {
        for (let i = 0; i < wall.length; i++) {
          if (wall.dir === "v") {
            addWall(wall.col, imageRowFromClassic(wall.row + i), "east");
          } else {
            addWall(wall.col + i, imageRowFromClassic(wall.row), "north");
          }
        }
      }

      const rooms = [];
      let nextId = 1;
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const start = cells[row][col];
          if (!start.isRoom || start.roomId !== null) continue;
          const id = nextId++;
          const squares = [];
          const stack = [start];
          start.roomId = id;
          while (stack.length) {
            const cell = stack.pop();
            squares.push({ col: cell.col, row: cell.row });
            for (const side of SIDES) {
              if (cell.walls[side]) continue;
              const { dc, dr } = STEP[side];
              const next = cells[cell.row + dr] && cells[cell.row + dr][cell.col + dc];
              if (!next || !next.isRoom || next.roomId !== null) continue;
              next.roomId = id;
              stack.push(next);
            }
          }
          rooms[id] = { id, squares };
        }
      }

      return {
        cells,
        rooms,
        cell(col, row) {
          if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return null;
          return cells[row][col];
        },
        room(id) {
          return rooms[id] || null;
        },
      };
    }

    const board = createBoard();

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const image = new Image();
    image.src = "images/board.jpeg";
    let showGrid = true;
    let showDebug = false;
    let selected = null;
    const explored = Array.from({ length: ROWS }, () => Array(COLS).fill(false));

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
      draw();
    }

    function boardLayout() {
      const scale = Math.min(
        canvas.width / image.naturalWidth,
        canvas.height / image.naturalHeight
      );
      const width = image.naturalWidth * scale;
      const height = image.naturalHeight * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;
      const scaleX = width / image.naturalWidth;
      const scaleY = height / image.naturalHeight;
      return {
        x,
        y,
        width,
        height,
        gridX: x + GRID.x * scaleX,
        gridY: y + GRID.y * scaleY,
        gridW: GRID.width * scaleX,
        gridH: GRID.height * scaleY,
      };
    }

    function squareLabel(col, row) {
      return String.fromCharCode(65 + col) + (row + 1);
    }

    function drawGrid(layout) {
      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
      ctx.lineWidth = Math.max(1, window.devicePixelRatio || 1);
      for (let col = 0; col <= COLS; col++) {
        const lineX = layout.gridX + (layout.gridW * col) / COLS;
        ctx.moveTo(lineX, layout.gridY);
        ctx.lineTo(lineX, layout.gridY + layout.gridH);
      }
      for (let row = 0; row <= ROWS; row++) {
        const lineY = layout.gridY + (layout.gridH * row) / ROWS;
        ctx.moveTo(layout.gridX, lineY);
        ctx.lineTo(layout.gridX + layout.gridW, lineY);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawDebug(layout) {
      const cellW = layout.gridW / COLS;
      const cellH = layout.gridH / ROWS;

      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 45, 45, 0.95)";
      ctx.lineWidth = Math.max(2, (window.devicePixelRatio || 1) * 2);
      ctx.lineCap = "square";
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          if (!squareRevealed(col, row)) continue;
          const walls = board.cells[row][col].walls;
          const x = layout.gridX + col * cellW;
          const y = layout.gridY + row * cellH;
          if (walls.north) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + cellW, y);
          }
          if (walls.west) {
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + cellH);
          }
          if (walls.south) {
            ctx.moveTo(x, y + cellH);
            ctx.lineTo(x + cellW, y + cellH);
          }
          if (walls.east) {
            ctx.moveTo(x + cellW, y);
            ctx.lineTo(x + cellW, y + cellH);
          }
        }
      }
      ctx.stroke();

      ctx.font = `bold ${Math.max(10, cellH * 0.42)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = Math.max(2, (window.devicePixelRatio || 1) * 1.5);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
      ctx.fillStyle = "#ffffff";
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const roomId = board.cells[row][col].roomId;
          if (roomId === null || !squareRevealed(col, row)) continue;
          const x = layout.gridX + (col + 0.5) * cellW;
          const y = layout.gridY + (row + 0.5) * cellH;
          ctx.strokeText(String(roomId), x, y);
          ctx.fillText(String(roomId), x, y);
        }
      }
      ctx.restore();
    }

    const MONSTER_TYPES = [
      { id: "skeleton", name: "Skeleton", color: "#d5dde8", letter: "S", text: "#1a1a1a" },
      { id: "zombie", name: "Zombie", color: "#3f9a55", letter: "Z", text: "#f4fff5" },
    ];

    const PLACEABLE_STYLES = {
      chest: { color: "#e2b340", letter: "C", text: "#1a1a1a" },
      rock: { color: "#8d8478", letter: "R", text: "#1a1a1a" },
      door: { color: "#3d9ad4", letter: "D", text: "#f4fbff" },
    };

    const QUEST_COUNTS = {
      easy: { doors: 24, rocks: 4, chests: 3, monsters: 6 },
      normal: { doors: 24, rocks: 8, chests: 5, monsters: 12 },
      hard: { doors: 24, rocks: 14, chests: 8, monsters: 18 },
    };

    const quest = {
      doors: [],
      rocks: [],
      chests: [],
      monsters: [],
    };

    function squareKey(col, row) {
      return col + "," + row;
    }

    function edgeKey(col, row, side) {
      if (side === "west") return edgeKey(col - 1, row, "east");
      if (side === "north") return edgeKey(col, row - 1, "south");
      return col + "," + row + "," + side;
    }

    function stepTo(col, row, side) {
      const { dc, dr } = STEP[side];
      const nextCol = col + dc;
      const nextRow = row + dr;
      if (nextRow < 0 || nextCol < 0 || nextRow >= ROWS || nextCol >= COLS) return null;
      return board.cells[nextRow][nextCol];
    }

    function isObjective(cell) {
      return questSettings.objectiveRoomId !== null && cell.roomId === questSettings.objectiveRoomId;
    }

    function makeDoor(edge) {
      return { ...edge, open: false, visible: true };
    }

    function doorEdgeSet(openOnly = false) {
      const keys = [];
      for (const door of quest.doors) {
        if (openOnly && !door.open) continue;
        keys.push(door.key);
      }
      return new Set(keys);
    }

    function passageOpen(col, row, side, doors) {
      const cell = board.cells[row][col];
      if (!cell.walls[side]) return true;
      return doors.has(edgeKey(col, row, side));
    }

    function allSquaresReachable(blocked, doors) {
      let free = 0;
      let start = null;
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          if (blocked.has(squareKey(col, row))) continue;
          free++;
          if (!start) start = [col, row];
        }
      }
      if (!start) return true;

      const seen = new Set([squareKey(start[0], start[1])]);
      const stack = [start];
      while (stack.length) {
        const [col, row] = stack.pop();
        for (const side of SIDES) {
          if (!passageOpen(col, row, side, doors)) continue;
          const next = stepTo(col, row, side);
          if (!next) continue;
          const key = squareKey(next.col, next.row);
          if (blocked.has(key) || seen.has(key)) continue;
          seen.add(key);
          stack.push([next.col, next.row]);
        }
      }
      return seen.size === free;
    }

    function squareRevealed(col, row) {
      return questSettings.revealAll || explored[row][col];
    }

    function resetExploration() {
      for (let row = 0; row < ROWS; row++) explored[row].fill(false);
      selected = null;
    }

    // Center-to-center grid ray. A wall, a shut door, or a rock stops the ray.
    // Corner crossings are blocked when any edge meeting that corner is a wall,
    // so vision cannot slip between two wall ends.
    function hasLineOfSight(c0, r0, c1, r1, doors, rocks) {
      if (c0 === c1 && r0 === r1) return true;

      const dx = c1 - c0;
      const dy = r1 - r0;
      const stepCol = dx > 0 ? 1 : dx < 0 ? -1 : 0;
      const stepRow = dy > 0 ? 1 : dy < 0 ? -1 : 0;
      const tDeltaCol = stepCol === 0 ? Infinity : Math.abs(1 / dx);
      const tDeltaRow = stepRow === 0 ? Infinity : Math.abs(1 / dy);
      let tMaxCol = stepCol === 0 ? Infinity : tDeltaCol * 0.5;
      let tMaxRow = stepRow === 0 ? Infinity : tDeltaRow * 0.5;
      let col = c0;
      let row = r0;

      const limit = Math.abs(dx) + Math.abs(dy) + 1;
      for (let i = 0; i < limit; i++) {
        const corner = tMaxCol !== Infinity && tMaxRow !== Infinity &&
          Math.abs(tMaxCol - tMaxRow) <= 1e-8 * Math.max(1, tMaxCol, tMaxRow);
        if (corner) {
          const sideCol = stepCol > 0 ? "east" : "west";
          const sideRow = stepRow > 0 ? "south" : "north";
          const nextCol = col + stepCol;
          const nextRow = row + stepRow;
          if (nextCol < 0 || nextRow < 0 || nextCol >= COLS || nextRow >= ROWS) return false;
          if (!passageOpen(col, row, sideCol, doors) || !passageOpen(col, row, sideRow, doors)) return false;
          if (!passageOpen(nextCol, row, sideRow, doors) || !passageOpen(col, nextRow, sideCol, doors)) return false;
          if (rocks.has(squareKey(nextCol, row)) || rocks.has(squareKey(col, nextRow))) return false;
          col = nextCol;
          row = nextRow;
          tMaxCol += tDeltaCol;
          tMaxRow += tDeltaRow;
        } else if (tMaxCol < tMaxRow) {
          if (!passageOpen(col, row, stepCol > 0 ? "east" : "west", doors)) return false;
          col += stepCol;
          tMaxCol += tDeltaCol;
        } else {
          if (!passageOpen(col, row, stepRow > 0 ? "south" : "north", doors)) return false;
          row += stepRow;
          tMaxRow += tDeltaRow;
        }

        if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return false;
        if (col === c1 && row === r1) return true;
        if (rocks.has(squareKey(col, row))) return false;
      }
      return false;
    }

    function revealFrom(col, row) {
      const doors = doorEdgeSet(true);
      const rocks = new Set(quest.rocks.map((rock) => squareKey(rock.col, rock.row)));
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (explored[r][c]) continue;
          if (hasLineOfSight(col, row, c, r, doors, rocks)) explored[r][c] = true;
        }
      }
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function regionOf(cell) {
      return cell.isRoom ? "room:" + cell.roomId : "corridor";
    }

    function wallEdges() {
      const edges = [];
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = board.cells[row][col];
          for (const side of ["east", "south"]) {
            if (!cell.walls[side]) continue;
            const other = stepTo(col, row, side);
            if (!other) continue;
            if (isObjective(cell) && isObjective(other)) continue;
            edges.push({
              col,
              row,
              side,
              key: edgeKey(col, row, side),
              touchesObjective: isObjective(cell) || isObjective(other),
            });
          }
        }
      }
      return edges;
    }

    // A room side may have one door toward a corridor, plus another only when
    // that side also opens into a different room.
    function wallSlots(edge) {
      const here = board.cells[edge.row][edge.col];
      const other = stepTo(edge.col, edge.row, edge.side);
      const slots = [];
      if (here.isRoom) slots.push(here.roomId + "|" + edge.side + "|" + regionOf(other));
      if (other.isRoom) {
        slots.push(other.roomId + "|" + OPPOSITE[edge.side] + "|" + regionOf(here));
      }
      return slots;
    }

    function slotsFree(edge, usedSlots) {
      return wallSlots(edge).every((slot) => !usedSlots.has(slot));
    }

    function claimSlots(edge, usedSlots) {
      for (const slot of wallSlots(edge)) usedSlots.add(slot);
    }

    function makeDisjointSets() {
      const parent = Array.from({ length: ROWS * COLS }, (_, index) => index);
      function find(index) {
        let cursor = index;
        while (parent[cursor] !== cursor) {
          parent[cursor] = parent[parent[cursor]];
          cursor = parent[cursor];
        }
        return cursor;
      }
      function union(a, b) {
        const left = find(a);
        const right = find(b);
        if (left !== right) parent[left] = right;
      }
      function index(col, row) {
        return row * COLS + col;
      }
      function groups() {
        const roots = new Set();
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) roots.add(find(index(col, row)));
        }
        return roots.size;
      }
      return { find, union, index, groups };
    }

    function connectByDoors(sets, edges, usedSlots) {
      for (const edge of shuffle(edges.slice())) {
        if (!slotsFree(edge, usedSlots)) continue;
        const other = stepTo(edge.col, edge.row, edge.side);
        const left = sets.find(sets.index(edge.col, edge.row));
        const right = sets.find(sets.index(other.col, other.row));
        if (left === right) continue;
        sets.union(left, right);
        claimSlots(edge, usedSlots);
        quest.doors.push(makeDoor(edge));
      }
    }

    function placeDoors(target) {
      const sets = makeDisjointSets();
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          for (const side of ["east", "south"]) {
            if (board.cells[row][col].walls[side]) continue;
            const other = stepTo(col, row, side);
            if (!other) continue;
            sets.union(sets.index(col, row), sets.index(other.col, other.row));
          }
        }
      }

      const edges = wallEdges();
      const usedSlots = new Set();
      connectByDoors(sets, edges.filter((edge) => !edge.touchesObjective), usedSlots);
      connectByDoors(sets, edges.filter((edge) => edge.touchesObjective), usedSlots);

      const used = doorEdgeSet();
      const extras = shuffle(edges.filter((edge) => !edge.touchesObjective && !used.has(edge.key)));
      while (quest.doors.length < target && extras.length) {
        const edge = extras.pop();
        if (!slotsFree(edge, usedSlots)) continue;
        claimSlots(edge, usedSlots);
        quest.doors.push(makeDoor(edge));
      }
    }

    function emptyFloorSquares() {
      const taken = new Set([
        ...quest.rocks.map((item) => squareKey(item.col, item.row)),
        ...quest.chests.map((item) => squareKey(item.col, item.row)),
        ...quest.monsters.map((item) => squareKey(item.col, item.row)),
      ]);
      const squares = [];
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = board.cells[row][col];
          if (isObjective(cell) || taken.has(squareKey(col, row))) continue;
          squares.push(cell);
        }
      }
      return squares;
    }

    function placeRocks(count) {
      const doors = doorEdgeSet();
      const blocked = new Set(quest.rocks.map((rock) => squareKey(rock.col, rock.row)));
      for (const cell of shuffle(emptyFloorSquares().filter((square) => !square.isRoom))) {
        if (quest.rocks.length >= count) break;
        const key = squareKey(cell.col, cell.row);
        blocked.add(key);
        if (!allSquaresReachable(blocked, doors)) {
          blocked.delete(key);
          continue;
        }
        quest.rocks.push({ col: cell.col, row: cell.row, visible: true });
      }
    }

    function placeChests(count) {
      for (const cell of shuffle(emptyFloorSquares().filter((square) => square.isRoom))) {
        if (quest.chests.length >= count) break;
        quest.chests.push({ col: cell.col, row: cell.row, visible: true });
      }
    }

    function placeMonsters(count) {
      const pool = emptyFloorSquares();
      for (let placed = 0; placed < count && pool.length; placed++) {
        const weights = pool.map((cell) => (cell.isRoom ? 4 : 1));
        let roll = Math.random() * weights.reduce((sum, weight) => sum + weight, 0);
        let index = pool.length - 1;
        for (let i = 0; i < pool.length; i++) {
          roll -= weights[i];
          if (roll <= 0) {
            index = i;
            break;
          }
        }
        const cell = pool.splice(index, 1)[0];
        const type = MONSTER_TYPES[Math.floor(Math.random() * MONSTER_TYPES.length)];
        quest.monsters.push({
          col: cell.col,
          row: cell.row,
          typeId: type.id,
          visible: true,
        });
      }
    }

    function clearQuest() {
      quest.doors.length = 0;
      quest.rocks.length = 0;
      quest.chests.length = 0;
      quest.monsters.length = 0;
    }

    function generateQuest() {
      syncQuestSettings();
      clearQuest();
      resetExploration();
      const counts = QUEST_COUNTS[questSettings.difficulty] || QUEST_COUNTS.normal;
      placeDoors(counts.doors);
      placeRocks(counts.rocks);
      placeChests(counts.chests);
      placeMonsters(counts.monsters);
      console.log(
        "Placed " + quest.monsters.length + " monsters, " +
        quest.rocks.length + " rocks, " +
        quest.chests.length + " chests, " +
        quest.doors.length + " doors",
        { ...questSettings }
      );
      draw();
    }

    function drawToken(cx, cy, radius, style) {
      ctx.beginPath();
      ctx.fillStyle = style.color;
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = Math.max(1, radius * 0.12);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
      ctx.stroke();
      ctx.fillStyle = style.text;
      ctx.font = "bold " + Math.round(radius * 1.15) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(style.letter, cx, cy + radius * 0.05);
    }

    function drawQuest(layout) {
      const cellW = layout.gridW / COLS;
      const cellH = layout.gridH / ROWS;
      const radius = Math.min(cellW, cellH) * 0.32;

      ctx.save();
      for (const rock of quest.rocks) {
        if (rock.visible === false || !squareRevealed(rock.col, rock.row)) continue;
        drawToken(
          layout.gridX + (rock.col + 0.5) * cellW,
          layout.gridY + (rock.row + 0.5) * cellH,
          radius,
          PLACEABLE_STYLES.rock
        );
      }
      for (const chest of quest.chests) {
        if (chest.visible === false || !squareRevealed(chest.col, chest.row)) continue;
        drawToken(
          layout.gridX + (chest.col + 0.5) * cellW,
          layout.gridY + (chest.row + 0.5) * cellH,
          radius,
          PLACEABLE_STYLES.chest
        );
      }
      for (const monster of quest.monsters) {
        if (monster.visible === false || !squareRevealed(monster.col, monster.row)) continue;
        const type = MONSTER_TYPES.find((entry) => entry.id === monster.typeId);
        if (!type) continue;
        drawToken(
          layout.gridX + (monster.col + 0.5) * cellW,
          layout.gridY + (monster.row + 0.5) * cellH,
          radius,
          type
        );
      }
      for (const door of quest.doors) drawDoor(door, layout);
      ctx.restore();
    }

    function doorShown(door) {
      if (door.visible === false) return false;
      if (squareRevealed(door.col, door.row)) return true;
      const other = stepTo(door.col, door.row, door.side);
      return !!(other && squareRevealed(other.col, other.row));
    }

    function doorFrame(door, layout) {
      const cellW = layout.gridW / COLS;
      const cellH = layout.gridH / ROWS;
      const x = layout.gridX + door.col * cellW;
      const y = layout.gridY + door.row * cellH;
      const vertical = door.side === "east";
      return {
        cx: vertical ? x + cellW : x + cellW / 2,
        cy: vertical ? y + cellH / 2 : y + cellH,
        width: vertical ? cellW * 0.28 : cellW * 0.62,
        height: vertical ? cellH * 0.62 : cellH * 0.28,
        token: Math.min(cellW, cellH) * 0.2,
      };
    }

    function drawDoor(door, layout) {
      if (!doorShown(door)) return;
      const frame = doorFrame(door, layout);
      const left = frame.cx - frame.width / 2;
      const top = frame.cy - frame.height / 2;
      ctx.fillStyle = PLACEABLE_STYLES.door.color;
      if (door.open) {
        ctx.strokeStyle = PLACEABLE_STYLES.door.color;
        ctx.lineWidth = Math.max(2, (window.devicePixelRatio || 1) * 1.5);
        ctx.strokeRect(left, top, frame.width, frame.height);
      } else {
        ctx.fillRect(left, top, frame.width, frame.height);
      }
      drawToken(frame.cx, frame.cy, frame.token, PLACEABLE_STYLES.door);
    }

    function doorAtPoint(px, py, layout) {
      for (let i = quest.doors.length - 1; i >= 0; i--) {
        const door = quest.doors[i];
        if (!doorShown(door)) continue;
        const frame = doorFrame(door, layout);
        const pad = frame.token * 0.35;
        if (Math.abs(px - frame.cx) <= frame.width / 2 + pad && Math.abs(py - frame.cy) <= frame.height / 2 + pad) {
          return door;
        }
      }
      return null;
    }

    function drawHighlight(layout) {
      if (!selected) return;
      const cellW = layout.gridW / COLS;
      const cellH = layout.gridH / ROWS;
      const x = layout.gridX + selected.col * cellW;
      const y = layout.gridY + selected.row * cellH;

      ctx.save();
      ctx.fillStyle = "rgba(255, 214, 0, 0.45)";
      ctx.strokeStyle = "#ffe14a";
      ctx.lineWidth = Math.max(2, (window.devicePixelRatio || 1) * 2);
      ctx.fillRect(x, y, cellW, cellH);
      ctx.strokeRect(x, y, cellW, cellH);
      ctx.restore();
    }

    function drawFog(layout) {
      if (questSettings.revealAll) return;
      const cellW = layout.gridW / COLS;
      const cellH = layout.gridH / ROWS;
      ctx.save();
      ctx.fillStyle = "#050505";
      let anyRevealed = false;
      for (let row = 0; row < ROWS && !anyRevealed; row++) {
        anyRevealed = explored[row].some(Boolean);
      }
      if (!anyRevealed) {
        ctx.fillRect(layout.gridX, layout.gridY, layout.gridW, layout.gridH);
      } else {
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            if (explored[row][col]) continue;
            const x = layout.gridX + col * cellW;
            const y = layout.gridY + row * cellH;
            ctx.fillRect(x - 0.75, y - 0.75, cellW + 1.5, cellH + 1.5);
          }
        }
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!image.complete || image.naturalWidth === 0) return;

      const layout = boardLayout();
      ctx.drawImage(image, layout.x, layout.y, layout.width, layout.height);
      drawFog(layout);
      if (showGrid) drawGrid(layout);
      if (showDebug) drawDebug(layout);
      drawHighlight(layout);
      drawQuest(layout);
    }

    canvas.addEventListener("click", (event) => {
      if (!image.complete || image.naturalWidth === 0) return;

      const rect = canvas.getBoundingClientRect();
      const px = (event.clientX - rect.left) * (canvas.width / rect.width);
      const py = (event.clientY - rect.top) * (canvas.height / rect.height);
      const layout = boardLayout();
      const door = doorAtPoint(px, py, layout);
      if (door) {
        door.open = !door.open;
        if (selected) revealFrom(selected.col, selected.row);
        console.log((door.open ? "Opened" : "Shut") + " door", squareLabel(door.col, door.row) + " " + door.side);
        draw();
        return;
      }

      const col = Math.floor((px - layout.gridX) / (layout.gridW / COLS));
      const row = Math.floor((py - layout.gridY) / (layout.gridH / ROWS));
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

      selected = { col, row };
      revealFrom(col, row);
      const cell = board.cell(col, row);
      console.log(squareLabel(col, row), {
        isRoom: cell.isRoom,
        roomId: cell.roomId,
        walls: { ...cell.walls },
      });
      draw();
    });

    const questSettings = {
      difficulty: "normal",
      objectiveRoomId: null,
      revealAll: false,
    };

    const panelToggle = document.getElementById("panel-toggle");
    const questPanel = document.getElementById("quest-panel");
    const objectiveRoom = document.getElementById("objective-room");
    const revealAll = document.getElementById("reveal-all");

    for (const room of board.rooms) {
      if (!room) continue;
      const option = document.createElement("option");
      option.value = String(room.id);
      option.textContent = "Room " + room.id;
      objectiveRoom.append(option);
    }

    function syncQuestSettings() {
      questSettings.difficulty = document.querySelector('input[name="difficulty"]:checked').value;
      questSettings.objectiveRoomId = objectiveRoom.value === "" ? null : Number(objectiveRoom.value);
      questSettings.revealAll = revealAll.checked;
    }

    function setPanelOpen(open) {
      document.body.classList.toggle("panel-open", open);
      panelToggle.setAttribute("aria-expanded", String(open));
      questPanel.setAttribute("aria-hidden", String(!open));
      panelToggle.textContent = open ? "Hide" : "Quest";
      requestAnimationFrame(resize);
    }

    panelToggle.addEventListener("click", () => {
      setPanelOpen(!document.body.classList.contains("panel-open"));
    });

    document.querySelectorAll('input[name="difficulty"]').forEach((input) => {
      input.addEventListener("change", syncQuestSettings);
    });
    objectiveRoom.addEventListener("change", syncQuestSettings);

    document.getElementById("generate-quest").addEventListener("click", generateQuest);

    revealAll.addEventListener("change", () => {
      syncQuestSettings();
      console.log("Reveal All", questSettings.revealAll);
      draw();
    });

    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.key === "g" || event.key === "G") {
        showGrid = !showGrid;
        draw();
      } else if (event.key === "d" || event.key === "D") {
        showDebug = !showDebug;
        draw();
      }
    });

    window.quest = quest;

    image.addEventListener("load", draw);
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
